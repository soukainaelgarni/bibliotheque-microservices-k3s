services:
  notification-db:
    image: mysql:8.0
    pull_policy: never
    container_name: notification-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification_db
      MYSQL_USER: notification_user
      MYSQL_PASSWORD: notification_pass
    ports:
      - "3309:3306"
    volumes:
      - notification-db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "notification_user", "--password=notification_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    image: projet4/notification-service:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    restart: always
    depends_on:
      notification-db:
        condition: service_healthy
    environment:
      DB_HOST: notification-db
      DB_PORT: 3306
      DB_NAME: notification_db
      DB_USER: notification_user
      DB_PASSWORD: notification_pass
    ports:
      - "8082:8080"

volumes:
  notification-db-data: