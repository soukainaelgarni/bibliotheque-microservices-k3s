apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-emprunts-pvc
  namespace: projet4
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-emprunts
  namespace: projet4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-emprunts
  template:
    metadata:
      labels:
        app: mysql-emprunts
    spec:
      containers:
        - name: mysql
          image: mysql:8.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-emprunts-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - emprunts_user
                - -pemprunts_pass
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - emprunts_user
                - -pemprunts_pass
            initialDelaySeconds: 150
            periodSeconds: 15
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-emprunts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-emprunts
  namespace: projet4
spec:
  selector:
    app: mysql-emprunts
  ports:
    - port: 3306
      targetPort: 3306
