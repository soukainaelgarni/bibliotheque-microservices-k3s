apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-emprunts
  namespace: projet4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-emprunts
  template:
    metadata:
      labels:
        app: app-emprunts
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mysql-emprunts 3306; do echo "En attente de mysql-emprunts..."; sleep 3; done
        - name: wait-for-catalogue
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z app-catalogue 8080; do echo "En attente de app-catalogue..."; sleep 3; done
        - name: wait-for-notifications
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z notification-service 8080; do echo "En attente de notification-service..."; sleep 3; done
      containers:
        - name: app-emprunts
          image: projet4/app-emprunts:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql-emprunts
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-emprunts-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-emprunts-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-emprunts-secret
                  key: MYSQL_PASSWORD
            - name: NOTIFICATION_URL
              value: http://notification-service:8080/notification-service/api/notifications
            - name: CATALOGUE_URL
              value: http://app-catalogue:8080/bibliotheque-catalogue-projet/api/catalogue
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: app-emprunts
  namespace: projet4
spec:
  type: NodePort
  selector:
    app: app-emprunts
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
