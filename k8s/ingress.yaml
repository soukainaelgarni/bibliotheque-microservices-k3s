apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: projet4-ingress
  namespace: projet4
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /bibliotheque-catalogue-projet
            pathType: Prefix
            backend:
              service:
                name: app-catalogue
                port:
                  number: 8080
          - path: /emprunts
            pathType: Prefix
            backend:
              service:
                name: app-emprunts
                port:
                  number: 8080
          - path: /notification-service
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8080
