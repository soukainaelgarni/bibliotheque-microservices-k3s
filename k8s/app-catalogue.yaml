apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-catalogue
  namespace: projet4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-catalogue
  template:
    metadata:
      labels:
        app: app-catalogue
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mysql-catalogue 3306; do echo "En attente de mysql-catalogue..."; sleep 3; done
      containers:
        - name: app-catalogue
          image: projet4/app-catalogue:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql-catalogue
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-catalogue-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-catalogue-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-catalogue-secret
                  key: MYSQL_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: app-catalogue
  namespace: projet4
spec:
  type: NodePort
  selector:
    app: app-catalogue
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
