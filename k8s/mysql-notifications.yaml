apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-notifications-pvc
  namespace: projet4
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-db
  namespace: projet4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-db
  template:
    metadata:
      labels:
        app: notification-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-notifications-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - notification_user
                - -pnotification_pass
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - notification_user
                - -pnotification_pass
            initialDelaySeconds: 150
            periodSeconds: 15
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-notifications-pvc
        - name: init-sql
          configMap:
            name: notification-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: notification-db
  namespace: projet4
spec:
  selector:
    app: notification-db
  ports:
    - port: 3306
      targetPort: 3306
