apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-db-init
  namespace: projet4
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS notification_db;

    USE notification_db;

    CREATE TABLE IF NOT EXISTS notifications (
        id INT AUTO_INCREMENT PRIMARY KEY,
        etudiant_id INT NOT NULL,
        titre VARCHAR(255) NOT NULL,
        message TEXT NOT NULL,
        type VARCHAR(50) NOT NULL,
        statut VARCHAR(50) DEFAULT 'NON_LUE',
        date_creation TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO notifications(etudiant_id, titre, message, type, statut)
    VALUES
    (1, 'Bienvenue', 'Bienvenue dans le service Notifications.', 'MESSAGE_FORUM', 'NON_LUE'),
    (2, 'Retard de restitution', 'Vous avez depasse la date de retour du livre.', 'RETARD_LIVRE', 'NON_LUE');
