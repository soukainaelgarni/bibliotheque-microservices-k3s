services:

  # ═══ Base de données MySQL ═══
  mysql-emprunts:
    image: mysql:8.3
    pull_policy: never
    container_name: mysql-emprunts
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: emprunts_db
      MYSQL_USER: emprunts_user
      MYSQL_PASSWORD: emprunts_pass
    ports:
      - "3308:3306"
    volumes:
      - emprunts-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "emprunts_user", "--password=emprunts_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  # ═══ Application WildFly ═══
  app-emprunts:
    image: projet4/app-emprunts:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-emprunts
    environment:
      DB_HOST: mysql-emprunts
      DB_PORT: 3306
      DB_NAME: emprunts_db
      DB_USER: emprunts_user
      DB_PASSWORD: emprunts_pass
      NOTIFICATION_URL: http://notification-service:8080/notification-service/api/notifications
      CATALOGUE_URL: http://app-catalogue:8080/bibliotheque-catalogue-projet/api/catalogue
    ports:
      - "8081:8080"
    depends_on:
      mysql-emprunts:
        condition: service_healthy
    restart: on-failure

volumes:
  emprunts-db-data:
